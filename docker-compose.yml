version: '3.8'

services:
  # 1. Edge Load Balancer & Reverse Proxy
  gateway:
    image: nginx:alpine
    container_name: bankshield-gateway
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-worker-1
      - api-worker-2
    networks:
      - bankshield-net

  # 2. Banking Microservice Replica 1
  api-worker-1:
    build: .
    container_name: bankshield-worker-1
    environment:
      - NODE_ENV=production
      - PORT=8001
      - WORKER_ID=Worker-1
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://bankuser:bankpass123@postgres:5432/bankshield_db
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - bankshield-net

  # 3. Banking Microservice Replica 2 (Horizontal Scaling)
  api-worker-2:
    build: .
    container_name: bankshield-worker-2
    environment:
      - NODE_ENV=production
      - PORT=8002
      - WORKER_ID=Worker-2
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://bankuser:bankpass123@postgres:5432/bankshield_db
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - bankshield-net

  # 4. Distributed Lock & Idempotency Store (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: bankshield-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bankshield-net

  # 5. Core Double-Entry Ledger Database (PostgreSQL 15)
  postgres:
    image: postgres:15-alpine
    container_name: bankshield-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass123
      POSTGRES_DB: bankshield_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d bankshield_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bankshield-net

  # 6. Event-Driven Message Broker (Apache Kafka with KRaft - No Zookeeper!)
  kafka:
    image: apache/kafka:latest
    container_name: bankshield-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - bankshield-net

  # 7. Asynchronous Audit Ledger & Fraud Analytics Consumer
  audit-worker:
    build: .
    container_name: bankshield-audit-consumer
    command: ["node", "services/audit_consumer.js"]
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgresql://bankuser:bankpass123@postgres:5432/bankshield_db
    depends_on:
      - kafka
      - postgres
    networks:
      - bankshield-net

networks:
  bankshield-net:
    driver: bridge

volumes:
  pgdata:
